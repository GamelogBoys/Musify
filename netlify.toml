[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Proxy frontend /api requests to Netlify Serverless Lambdas
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Standalone React Routing rule fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200